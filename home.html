<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BillBuddy – Split a bill</title>
<style>
:root{--bg:#f1f5f3;--ink:#102a2e;--mute:#5b7174;--teal:#0e7c7b;--coin:#f6c945;--paper:#fffdf7;--card:#fff;--line:#d5dfdc;color-scheme:light}
@media(prefers-color-scheme:dark){:root{--bg:#0d1d20;--ink:#eaf3f1;--mute:#8fa8aa;--teal:#37c2b8;--paper:#16292d;--card:#122529;--line:#274044;color-scheme:dark}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:ui-rounded,"Avenir Next","Segoe UI",system-ui,sans-serif;line-height:1.45;min-height:100vh}
.wrap{max-width:960px;margin:0 auto;padding:24px 20px 60px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--ink);text-decoration:none}
.logo i{width:28px;height:28px;border-radius:50%;background:var(--coin);display:grid;place-items:center;color:#102a2e;font-style:normal;font-size:.95rem}
.app{display:grid;grid-template-columns:1fr 360px;gap:28px;align-items:start}
.panel{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:24px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border-radius:12px;padding:4px;margin-bottom:22px}
.seg button{border:0;background:none;color:var(--mute);font:inherit;font-weight:700;padding:10px;border-radius:9px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--bg)}
label,.lab{display:block;font-weight:700;font-size:.92rem;margin:18px 0 8px}
.lab:first-of-type{margin-top:0}
input[type=number],input[type=text]{width:100%;font:inherit;font-size:1.1rem;padding:13px 14px;border:2px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.money{position:relative}.money span{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--mute);font-weight:700}
.money input{padding-left:30px;font-size:1.6rem;font-weight:800}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{flex:1;min-width:52px;border:2px solid var(--line);background:none;color:var(--ink);font:inherit;font-weight:700;padding:10px 6px;border-radius:12px;cursor:pointer}
.chips button[aria-pressed=true]{border-color:var(--teal);background:var(--teal);color:#fff}
.step{display:flex;align-items:center;gap:16px}
.step button{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--ink);font-size:1.5rem;cursor:pointer}
.step output{font-size:1.6rem;font-weight:800;min-width:2ch;text-align:center}
.check{display:flex;align-items:center;gap:10px;margin-top:22px;font-weight:600;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--teal)}
.person{display:grid;grid-template-columns:1fr 110px 38px;gap:8px;margin-bottom:8px}
.person input{font-size:1rem;padding:11px 12px}
.person button{border:0;background:none;color:var(--mute);font-size:1.3rem;cursor:pointer;border-radius:10px}
.add{margin-top:6px;border:2px dashed var(--line);background:none;color:var(--ink);font:inherit;font-weight:700;padding:11px;border-radius:12px;width:100%;cursor:pointer}
.hide{display:none!important}
.receipt{background:var(--paper);padding:26px 24px 34px;border-radius:6px 6px 0 0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:.92rem;box-shadow:0 20px 44px -22px rgba(16,42,46,.5);position:sticky;top:20px;
-webkit-mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%;mask:conic-gradient(from -45deg at bottom,#0000,#000 1deg 89deg,#0000 90deg) 50%/16px 100%}
.receipt h2{text-align:center;font-size:1rem;margin-bottom:14px}
.row{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.rule{border-top:2px dashed var(--mute);opacity:.5;margin:12px 0}
.big{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.big b{font-size:1.6rem;background:var(--coin);color:#102a2e;padding:2px 12px;border-radius:6px}
.empty{color:var(--mute);text-align:center;padding:10px 0}
@media(max-width:800px){.app{grid-template-columns:1fr}.receipt{position:static}}
</style>
</head>
<body>
<div class="wrap">
<header><a class="logo" href="index.html"><i>₹</i>BillBuddy</a></header>
<main class="app">
<section class="panel">
<div class="seg" role="group" aria-label="Split mode">
<button id="mEven" aria-pressed="true">Split evenly</button>
<button id="mItem" aria-pressed="false">By person</button>
</div>

<div id="evenBox">
<span class="lab">Bill total</span>
<div class="money"><span>₹</span><input id="bill" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" aria-label="Bill total"></div>
</div>

<div id="itemBox" class="hide">
<span class="lab">What each person ordered</span>
<div id="people"></div>
<button class="add" id="addP">Add person</button>
</div>

<span class="lab">Tip</span>
<div class="chips" id="tips"></div>
<div class="money" style="margin-top:8px"><span>%</span><input id="tipC" type="number" inputmode="decimal" min="0" step="1" placeholder="Custom tip" aria-label="Custom tip percent"></div>

<div id="countBox">
<span class="lab">People</span>
<div class="step"><button id="minus" aria-label="Fewer people">−</button><output id="n">2</output><button id="plus" aria-label="More people">+</button></div>
</div>

<label class="check"><input type="checkbox" id="round"> Round each share up to the next rupee</label>
</section>

<aside class="receipt" aria-live="polite">
<h2>YOUR SPLIT</h2>
<div id="out"></div>
</aside>
</main>
</div>
<script>
const ₹=id=>document.getElementById(id);
const fmt=v=>'₹'+v.toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const S={mode:'even',tip:18,n:2,people:[{name:'',amt:''},{name:'',amt:''}]};
const tipsEl=₹('tips');
[0,10,15,18,20].forEach(t=>{const b=document.createElement('button');b.textContent=t+'%';b.dataset.t=t;b.onclick=()=>{S.tip=t;₹('tipC').value='';render()};tipsEl.append(b)});
₹('tipC').oninput=e=>{S.tip=Math.max(0,parseFloat(e.target.value)||0);render()};
₹('bill').oninput=render;₹('round').onchange=render;
₹('minus').onclick=()=>{S.n=Math.max(1,S.n-1);render()};
₹('plus').onclick=()=>{S.n=Math.min(50,S.n+1);render()};
₹('mEven').onclick=()=>{S.mode='even';render()};
₹('mItem').onclick=()=>{S.mode='item';render()};
₹('addP').onclick=()=>{S.people.push({name:'',amt:''});drawPeople();render()};
function drawPeople(){
  const box=₹('people');box.innerHTML='';
  S.people.forEach((p,i)=>{
    const r=document.createElement('div');r.className='person';
    r.innerHTML='<input type="text" placeholder="Person '+(i+1)+'" aria-label="Name"><input type="number" inputmode="decimal" min="0" step="0.01" placeholder="₹0.00" aria-label="Amount"><button aria-label="Remove person">×</button>';
    const [nm,am,rm]=r.children;
    nm.value=p.name;am.value=p.amt;
    nm.oninput=()=>{p.name=nm.value;render()};
    am.oninput=()=>{p.amt=am.value;render()};
    rm.onclick=()=>{if(S.people.length>1){S.people.splice(i,1);drawPeople();render()}};
    box.append(r);
  });
}
function up(v){return ₹('round').checked?Math.ceil(v-1e-9):v}
function render(){
  const item=S.mode==='item';
  ₹('mEven').setAttribute('aria-pressed',!item);₹('mItem').setAttribute('aria-pressed',item);
  ₹('evenBox').classList.toggle('hide',item);₹('itemBox').classList.toggle('hide',!item);₹('countBox').classList.toggle('hide',item);
  [...tipsEl.children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.t===S.tip&&!₹('tipC').value));
  ₹('n').textContent=S.n;
  const k=S.tip/100,out=₹('out');
  if(!item){
    const bill=parseFloat(₹('bill').value)||0;
    if(bill<=0){out.innerHTML='<p class="empty">Enter the bill total to see each share.</p>';return}
    const tip=bill*k,total=bill+tip,each=up(total/S.n);
    out.innerHTML=row('Bill',fmt(bill))+row('Tip ('+S.tip+'%)',fmt(tip))+'<div class="rule"></div>'+row('Total',fmt(total))+row('People',S.n)+'<div class="rule"></div><div class="big"><span>Each pays</span><b>'+fmt(each)+'</b></div>'+(each*S.n-total>0.005?'<p class="empty" style="margin-top:12px">Rounding adds '+fmt(each*S.n-total)+' extra.</p>':'');
  }else{
    const sub=S.people.reduce((s,p)=>s+(parseFloat(p.amt)||0),0);
    if(sub<=0){out.innerHTML='<p class="empty">Add what each person ordered to see their share.</p>';return}
    const tip=sub*k;let html=row('Food total',fmt(sub))+row('Tip ('+S.tip+'%)',fmt(tip))+'<div class="rule"></div>',sum=0;
    S.people.forEach((p,i)=>{const a=parseFloat(p.amt)||0,pay=up(a*(1+k));sum+=pay;html+=row(esc(p.name||'Person '+(i+1)),fmt(pay))});
    out.innerHTML=html+'<div class="rule"></div><div class="big"><span>Total</span><b>'+fmt(sum)+'</b></div>';
  }
}
function row(a,b){return '<div class="row"><span>'+a+'</span><span>'+b+'</span></div>'}
function esc(s){return s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
drawPeople();render();
</script>
</body>
</html>
